
[general]
static=yes
writeprotect=no
autofallthrough=yes
clearglobalvars=no
priorityjumping=no

[globals]
CONSOLE=Console/dsp
IAXINFO=guest
TRUNK=Zap/g2
TRUNKMSD=1

[voyants]
exten => 1000, 1, Answer()
exten => 1000, n, Playback(hello-world)
exten => 1000, n, Dial(SIP/1000,10,tr)
exten => 1000, n, HangUp()

exten => 1010, 1, Verbose("Reponse du cahhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhll")
exten => 1010, n, Dial(SIP/1010,30,tr)
exten => h,1,Noop(End)
exten => h,n,Noop(The call duration is: ${CDR(billsec)})
exten => h,n,AGI(/var/lib/asterisk/agi-bin/agi-script2.php)
exten => h,n,Noop(${client_id})


exten => _0[1-7]XXXXXXXX,1,Dial(SIP/${EXTEN}@trunk-ovh) 
exten => _09XXXXXXXX,1,Dial(SIP/${EXTEN}@trunk-ovh) 

exten => 111,1,Goto(ovh-sip,s,1)

[incoming] ;Redirection de l'alias 0366725520 vers l'extension 520. 
exten => 0366725520,1,Ringing(1) 
exten => 0366725520,2,Dial(SIP/1000,10,tm) ;Redirection de l'alias 0185450330 vers l'extension 330. 
exten => 0185450330,1,Ringing(1) 
exten => 0185450330,2,Dial(SIP/1010,10,tm) 
exten => 33493826330,1,Ringing(1)
same =>  n,Verbose("Do something different!")
same =>  n,Dial(SIP/${EXTEN}@trunk-ovh)
exten => s,2,Dial(SIP/1010,25,tm) ; L'appel est transfere sur le poste 330. Sans reponse apres 25 secondes il passe a l'Étape suivante 
exten => s,3,Hangup(16) ; La communication est termine
exten => 111,1,Goto(ovh-sip,s,1)

[ovh-sip] ;Redirection de l'alias 0366725520 vers l'extension 520. 
exten => 0366725520,1,Ringing(1)
exten => 0366725520,2,Dial(SIP/2000,10,tm) ;Redirection de l'alias 0185450330 vers l'extension 330. 
exten => 0185450330,1,Ringing(1) 
exten => 0185450330,2,Dial(SIP/2010,10,tm) 
exten => 0972127715,1,Verbose("Incoming call to my provider trunk")
exten => 0972127715,n,Goto(internal,1010,1)
exten => s,1,Verbose("Incoming calljjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjj");
exten => s,n,Set(TIMEOUT(response)=10)
exten => s,n,Set(TIMEOUT(digit)=10) 
exten => s,n,Goto(ivr-voyant,s,1)
;exten => s,n,Background(/var/lib/asterisk/sounds/custom/bienvenu) ; Attendre une seconde en faisant retentir la sonnerie du telephone de l'apellant 
exten => s,n,WaitExten(3)
exten => 1,1,Goto(ivr-srvc,srvc,1)
exten => 2,1,Goto(ivr-voyant,s,1)                      ; Si le choix est '2' 
exten => 3,1,Goto(ivr-reclam,rcl,1)                            ; Si le choix es 
exten => _[04-9*#],1,Goto(ovh-sip,s,1)                   ; Pour tout autre choix, renvoyer au début

exten => t,1,Goto(ovh-sip,s,1)

[outgoing]
exten => _X.,1,Dial(SIP/trunk-ovh/${EXTEN})  ; Sortir avec le trunk. On autoris 
exten => _0[1-7]XXXXXXXX,1,Dial(SIP/trunk-ovh/${EXTEN}) 
exten => _09XXXXXXXX,1,Dial(SIP/${EXTEN}@trunk-ovh)

[ivr-srvc]
exten => srvc,1,Dial(SIP/3000,10,tr)

[ivr-voyant]
exten => s,1,Noop("bienvenu à divincia")
exten => s,n,set(CHANNEL(musicclass)=custom)
exten => s,n,AGI(/var/lib/asterisk/agi-bin/agi-script1.php)
exten => h,1,Noop("Fin de l'appel")
exten => h,n,Verbose(${id_client})
exten => h,n,Verbose(${id_voyant})
exten => h,n,AGI(/var/lib/asterisk/agi-bin/agi-script2.php)
exten => h,n,Noop("fin du script")
exten =>t,1,Playback(/var/lib/asterisk/sounds/custom/timeout)
exten =>t,2,Hangup(16)
exten =>i,1,Playback(/var/lib/asterisk/sounds/custom/invalide)
exten =>i,2,Hangup(16)
[ivr-reclam]
exten => rcl,1,Dial(SIP/4000,10,tr)

